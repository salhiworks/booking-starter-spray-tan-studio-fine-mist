<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Overcast Tan Studio — custom spray tans in Elmwood Village, Buffalo</title>
    <meta name="description" content="An independent spray tan studio in Elmwood Village, Buffalo: custom full-body, express and event tans sprayed by hand, one client at a time. Book online." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Overcast Tan Studio — custom spray tans in Elmwood Village, Buffalo" />
    <meta property="og:description" content="An independent spray tan studio in Elmwood Village, Buffalo: custom full-body, express and event tans sprayed by hand, one client at a time. Book online." />
    <meta name="theme-color" content="#e5e8e8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The first-screen photo (wide; phones get a 4:5 crop of the same frame).
         imagesizes must match HERO_SIZES in src/components/Hero.tsx. -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      media="(min-width: 760px)"
      imagesrcset="/photos/hero-portrait-960.avif 960w, /photos/hero-portrait-1440.avif 1440w, /photos/hero-portrait-1920.avif 1920w, /photos/hero-portrait-2560.avif 2560w"
      imagesizes="(min-width: 960px) 56vw, 100vw"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      type="image/avif"
      media="(max-width: 759.98px)"
      imagesrcset="/photos/hero-portrait-phone-640.avif 640w, /photos/hero-portrait-phone-960.avif 960w, /photos/hero-portrait-phone-1280.avif 1280w"
      imagesizes="100vw"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
